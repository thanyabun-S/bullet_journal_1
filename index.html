<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      if (localStorage.getItem('bulletJournalTheme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<title>Bullet Journal</title>
<style>
  :root {
    color-scheme: light;
    --bg: #FAF8F3;
    --sidebar-bg: #F1EDE3;
    --surface: #FFFFFF;
    --surface-inset: #EFEAE0;
    --border: #E3DECF;
    --text: #2B2924;
    --text-muted: #8C8574;
    --accent: #33543D;
    --accent-light: #E6EEE5;
    --task-color: #33543D;
    --event-color: #A15C39;
    --note-color: #766B58;
    --important: #AD7D0A;
    --important-bg: #FBF3DC;
    --danger: #AE4038;
    --overdue: #BE3B2B;
    --overdue-bg: #FBEAE7;
    --due-today: #B5651D;
    --due-today-bg: #FCF0DE;
    --hover: rgba(43,41,36,0.06);
    --dot: rgba(43,41,36,0.08);
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(43,41,36,0.04), 0 3px 10px rgba(43,41,36,0.04);
    --shadow-lg: 0 10px 30px rgba(43,41,36,0.11);
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181A;
    --sidebar-bg: #121314;
    --surface: #1E2020;
    --surface-inset: #1A1B1B;
    --border: #2B2C2C;
    --text: #ECE7DC;
    --text-muted: #9B968A;
    --accent: #74B593;
    --accent-light: #1F2B23;
    --task-color: #74B593;
    --event-color: #D68A5C;
    --note-color: #ABA394;
    --important: #E8C468;
    --important-bg: #33291A;
    --danger: #DD8079;
    --overdue: #E57373;
    --overdue-bg: #3A2020;
    --due-today: #E0A458;
    --due-today-bg: #3A2C14;
    --hover: rgba(255,255,255,0.07);
    --dot: rgba(255,255,255,0.055);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 14px rgba(0,0,0,0.3);
    --shadow-lg: 0 10px 32px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Inter', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
  }

  button, input, select {
    font-family: inherit;
  }

  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ---------- App shell ---------- */
  .app-shell {
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }

  .sidebar-overlay {
    display: none;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 304px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: background 0.2s, border-color 0.2s, width 0.2s;
  }

  .sidebar-top {
    flex-shrink: 0;
    padding: 20px 16px 14px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .sidebar-brand h1 {
    font-size: 1.08rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .new-entry-btn {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 13px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }

  .new-entry-btn:hover { background: var(--surface); border-color: var(--accent); }
  .new-entry-btn:active { transform: scale(0.98); }

  .sidebar-search {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }

  #search-input, #filter-select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.82rem;
    background: var(--surface);
    color: var(--text);
    width: 100%;
  }

  #search-input:focus, #filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .sidebar-history {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 18px;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .sidebar-history-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding: 8px 6px 6px;
    font-weight: 600;
  }

  .sidebar-bottom {
    flex-shrink: 0;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar-bottom-row {
    display: flex;
    gap: 8px;
  }

  .sidebar-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 0.78rem;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }

  .sidebar-btn:hover { background: var(--hover); }
  .sidebar-btn:active { transform: scale(0.98); }

  /* ---------- History day groups ---------- */
  .history-day {
    margin-bottom: 6px;
    border-radius: 10px;
    overflow: hidden;
  }

  .history-day summary {
    cursor: pointer;
    padding: 10px 10px;
    border-radius: 12px;
    list-style: none;
    transition: background 0.15s;
  }

  .history-day summary:hover { background: var(--hover); }

  .history-day summary::-webkit-details-marker { display: none; }

  .day-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.83rem;
    font-weight: 600;
  }

  .day-row .arrow {
    color: var(--text-muted);
    transform: rotate(0deg);
    transition: transform 0.15s;
    margin-right: 6px;
    display: inline-block;
  }

  .history-day[open] .day-row .arrow { transform: rotate(90deg); }

  .day-row .count {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.68rem;
    font-family: var(--font-mono);
  }

  .day-important-preview {
    margin-top: 4px;
    padding-left: 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .history-day[open] .day-important-preview { display: none; }

  .imp-chip {
    font-size: 0.75rem;
    color: var(--important);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .imp-chip.none {
    color: var(--text-muted);
    font-style: italic;
  }

  .history-day .entry-list {
    padding-left: 4px;
    margin-top: 2px;
  }

  .sidebar .entry-item {
    font-size: 0.82rem;
    padding: 5px 4px;
  }

  .sidebar .bullet-mark { width: 16px; font-size: 0.85rem; }

  /* ---------- Main content ---------- */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    background: var(--bg);
  }

  .main-topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px clamp(24px, 5vw, 64px);
    border-bottom: 1px solid var(--border);
  }

  .icon-btn-plain {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--text);
    padding: 4px 6px;
    border-radius: 8px;
  }

  .icon-btn-plain:hover { background: var(--hover); }

  .main-topbar-date {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
  }

  .main-topbar-date .sub {
    display: block;
    font-weight: 400;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .board-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 38px clamp(28px, 6vw, 88px);
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: 6px 6px;
  }

  .board-section {
    margin-bottom: 38px;
  }

  .board-section h2 {
    font-size: 1.04rem;
    font-weight: 700;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.01em;
  }

  .board-section h2 .section-badge {
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--surface-inset);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
    font-family: var(--font-mono);
  }

  .board-card {
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
  }

  .board-card .entry-list {
    display: grid;
    gap: 10px;
  }

  .board-card .entry-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    margin: 0;
    padding: 13px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 7px 20px rgba(0,0,0,0.025);
  }

  .board-card .entry-item:last-child { border-bottom: 1px solid var(--border); }

  .board-card .entry-item:hover {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }

  .board-card .entry-item.sub-entry {
    margin: -4px 0 0 28px;
    border-radius: 14px;
    background: var(--surface-inset);
    box-shadow: none;
    padding: 10px 14px;
  }

  /* ---------- Daily progress bar ---------- */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: -2px 0 10px;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--surface-inset);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .progress-text {
    font-size: 0.72rem;
    font-family: var(--font-mono);
    font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .progress-wrap.empty .progress-track { opacity: 0.5; }

  .entry-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .entry-list:empty { margin: 0; }

  .entry-item {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px 8px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s, box-shadow 0.1s, opacity 0.15s;
  }

  .entry-item:hover { background: var(--surface-inset); border-radius: 8px; }

  .entry-item:last-child { border-bottom: none; }

  .entry-item.sub-entry {
    padding-left: 30px;
    font-size: 0.9rem;
  }

  .entry-item.sub-entry .bullet-mark {
    color: var(--note-color);
    font-size: 0.85rem;
  }

  .entry-item.important {
    background: var(--important-bg);
    border-radius: 6px;
  }

  .entry-item.important .entry-text {
    font-weight: 600;
  }

  .entry-item.important .bullet-mark {
    color: var(--important);
  }

  .entry-item.dragging { opacity: 0.4; }
  .entry-item.drag-over-top { box-shadow: inset 0 2px 0 0 var(--accent); }
  .entry-item.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--accent); }

  /* Hidden interactive affordances: visually hidden AND non-interactive until
     revealed by hover or keyboard focus, so they can't register "ghost" clicks. */
  .drag-handle {
    flex-shrink: 0;
    width: 16px;
    text-align: center;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text-muted);
    cursor: grab;
    user-select: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  .entry-item:hover .drag-handle,
  .entry-item:focus-within .drag-handle,
  .entry-item.mobile-actions-open .drag-handle {
    opacity: 1;
    pointer-events: auto;
  }

  .entry-item.dragging .drag-handle { cursor: grabbing; }

  .bullet-mark {
    flex-shrink: 0;
    width: 20px;
    text-align: center;
    font-size: 1rem;
    line-height: 1.5;
    user-select: none;
    cursor: default;
    opacity: 0.9;
  }

  .bullet-mark.clickable {
    cursor: pointer;
    opacity: 1;
    transition: transform 0.1s;
  }

  .bullet-mark.clickable:active { transform: scale(0.82); }

  .bullet-mark.task { color: var(--task-color); }
  .bullet-mark.event { color: var(--event-color); }
  .bullet-mark.note { color: var(--note-color); }

  .entry-text {
    flex: 1 1 140px;
    min-width: 140px;
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
    cursor: text;
  }

  .entry-item.completed .entry-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .entry-item.cancelled .entry-text {
    text-decoration: line-through;
    opacity: 0.55;
  }

  .entry-item[data-status="migrated"] .entry-text { color: var(--event-color); }
  .entry-item[data-status="scheduled"] .entry-text { color: var(--accent); }

  .entry-item .date-chip {
    font-size: 0.68rem;
    font-family: var(--font-mono);
    font-weight: 500;
    color: var(--text-muted);
    background: var(--surface-inset);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 7px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .due-badge {
    flex-shrink: 0;
    font-size: 0.72rem;
    font-family: var(--font-mono);
    font-weight: 600;
    border-radius: 999px;
    padding: 1px 9px;
    margin-top: 1px;
    white-space: nowrap;
    cursor: pointer;
  }

  .due-badge.due-overdue {
    color: var(--overdue);
    background: var(--overdue-bg);
    font-weight: 700;
  }

  .due-badge.due-today {
    color: var(--due-today);
    background: var(--due-today-bg);
    font-weight: 700;
  }

  .due-badge.due-future {
    color: var(--text-muted);
    background: var(--surface-inset);
  }

  .due-add-btn {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  .entry-item:hover .due-add-btn,
  .entry-item:focus-within .due-add-btn,
  .entry-item.mobile-actions-open .due-add-btn {
    opacity: 1;
    pointer-events: auto;
  }

  .edit-input, .edit-date-input {
    flex: 1;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }

  .edit-date-input { flex: none; font-size: 0.8rem; }

  .edit-input:focus, .edit-date-input:focus { outline: none; }

  .star-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text-muted);
    opacity: 0;
    pointer-events: none;
    padding: 0 2px;
    transition: opacity 0.15s, transform 0.1s;
  }

  .star-btn:active { transform: scale(0.8); }

  .star-btn.active {
    color: var(--important);
    opacity: 1;
    pointer-events: auto;
  }

  .entry-item:hover .star-btn,
  .entry-item:focus-within .star-btn,
  .entry-item.mobile-actions-open .star-btn {
    opacity: 1;
    pointer-events: auto;
  }

  .actions {
    display: flex;
    gap: 2px;
    margin-left: auto;
    flex-shrink: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  .entry-item:hover .actions,
  .entry-item:focus-within .actions,
  .entry-item.mobile-actions-open .actions {
    opacity: 1;
    pointer-events: auto;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.95rem;
    padding: 0 4px;
    transition: color 0.15s, transform 0.1s;
  }

  .icon-btn:active { transform: scale(0.85); }

  .icon-btn.cancel-btn.active { color: var(--danger); }
  .icon-btn.delete-btn:hover { color: var(--danger); }

  .entry-item.mobile-reordering {
    background: var(--accent-light);
    box-shadow: 0 0 0 2px var(--accent);
    opacity: 0.72;
    touch-action: none;
  }

  .subnote-input-row {
    padding-left: 30px;
    border-bottom: none;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 0.88rem;
    font-style: italic;
    padding: 14px 8px;
  }

  /* ---------- Composer (ChatGPT-style input) ---------- */
  .composer-wrap {
    flex-shrink: 0;
    padding: 14px clamp(24px, 5vw, 64px) calc(22px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    bottom: 0;
    background: linear-gradient(to bottom, transparent, var(--bg) 28%);
    z-index: 10;
  }

  .composer {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.03);
    padding: 9px 10px;
  }

  /* ---------- Collapsible type picker (popover) ---------- */
  .type-picker {
    position: relative;
    flex-shrink: 0;
  }

  .type-toggle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--surface-inset);
    color: var(--accent);
    font-size: 1.15rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }

  .type-toggle:hover { background: var(--hover); }
  .type-toggle:active { transform: scale(0.92); }
  .type-toggle[aria-expanded="true"] { background: var(--accent-light); }

  .type-popover {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    padding: 6px;
    min-width: 152px;
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    transform-origin: bottom left;
    pointer-events: none;
    transition: opacity 0.14s ease, transform 0.14s ease;
    z-index: 20;
  }

  .type-picker.open .type-popover {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .type-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.86rem;
    color: var(--text);
    text-align: left;
    transition: background 0.12s;
  }

  .type-option:hover { background: var(--hover); }
  .type-option.active { background: var(--accent-light); }
  .type-option.active .opt-label { font-weight: 600; color: var(--accent); }

  .type-option .opt-symbol {
    width: 18px;
    flex-shrink: 0;
    text-align: center;
    font-size: 1rem;
    color: var(--text-muted);
  }

  .type-option[data-type="task"] .opt-symbol { color: var(--task-color); }
  .type-option[data-type="event"] .opt-symbol { color: var(--event-color); }
  .type-option[data-type="note"] .opt-symbol { color: var(--note-color); }

  #entry-input {
    flex: 1;
    border: none;
    padding: 12px 8px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: transparent;

  }

    outline: none;
  }

  .date-picker {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }

  .date-hidden-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 2;
  }

  .date-toggle {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 50%;

    z-index: 1;

    background: var(--hover);
    color: var(--text);

    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

    position: absolute;
    top: 4px;
    right: 4px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    border: 1.5px solid var(--surface);

  #add-btn {
    background: var(--accent);

    border: none;
    border-radius: 50%;

    height: 40px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

  #add-btn:hover { opacity: 0.88; }
  #add-btn:active { transform: scale(0.92); }

  .legend {
    display: flex;
    gap: 14px;
    font-size: 0.72rem;
    color: var(--text-muted);
    justify-content: center;
    margin-top: 10px;
    flex-wrap: wrap;
    max-width: 900px;
  }

  @media (min-width: 861px) {
    .quick-filters { display: flex; padding: 10px clamp(24px, 5vw, 64px) 0; }

    .board-scroll[data-board-view="important"] .board-section { display: block; }
  }

  .legend span { display: flex; align-items: center; gap: 4px; }

  /* ---------- Mobile / responsive ---------- */
  .mobile-only { display: none; }

  .quick-filters {
    display: none;
    gap: 8px;
    padding: 0 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .quick-filters::-webkit-scrollbar { display: none; }

  .quick-filter {
    flex: 0 0 auto;
    min-height: 38px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;

  function genId() {
    return Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatDateLabel(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString(t().locale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function formatDateShort(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString(t().locale, { month: 'short', day: 'numeric' });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function dueDateStatus(dueDate) {
    if (!dueDate) return null;
    if (dueDate < TODAY) return 'overdue';
    if (dueDate === TODAY) return 'today';
    return 'future';
  }

  function renderDueBadgeHtml(dueDate) {
    if (!dueDate) return '';
    const status = dueDateStatus(dueDate);
    const icon = status === 'overdue' ? '⚠' : '📅';
    return '<span class="due-badge due-' + status + '" title="' + escapeHtml(t().dueTitle) + escapeHtml(formatDateLabel(dueDate)) + '">'
      + icon + ' ' + escapeHtml(formatDateShort(dueDate)) + '</span>';
  }

  function dueBucketRank(dueDate) {
    if (!dueDate) return 3;
    const status = dueDateStatus(dueDate);
    return status === 'overdue' ? 0 : (status === 'today' ? 1 : 2);
  }

  function defaultCompare(a, b) {
    const ai = a.important ? 0 : 1, bi = b.important ? 0 : 1;
    if (ai !== bi) return ai - bi;
    const ar = dueBucketRank(a.dueDate), br = dueBucketRank(b.dueDate);
    if (ar !== br) return ar - br;
    if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
    return (a.orderIndex || 0) - (b.orderIndex || 0);
  }

  function normalizeEntry(e) {
    return {
      id: e.id || genId(),
      text: e.text || '',
      type: (e.type === 'task' || e.type === 'event' || e.type === 'note') ? e.type : 'note',
      date: e.date || todayKey(),
      dueDate: e.dueDate || null,
      status: STATUS_ORDER.includes(e.status) ? e.status : (e.completed ? 'completed' : 'incomplete'),
      cancelled: !!e.cancelled,
      important: !!e.important,
      parentId: e.parentId || null,
      orderIndex: typeof e.orderIndex === 'number' ? e.orderIndex : Date.now()
    };
  }

  function loadEntries() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      return raw.map(normalizeEntry);
    } catch (e) {
      return [];
    }
  }

  function saveEntries(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function loadManualOrder() {
    try {
      return Object.assign({ today: false, incomplete: false, migrated: false }, JSON.parse(localStorage.getItem(MANUAL_ORDER_KEY)) || {});
    } catch (e) {
      return { today: false, incomplete: false, migrated: false };
    }
  }

  function saveManualOrder() {
    localStorage.setItem(MANUAL_ORDER_KEY, JSON.stringify(manualOrder));
  }

  let entries = loadEntries();
  let manualOrder = loadManualOrder();
  let currentLang = localStorage.getItem(LANG_KEY) === 'th' ? 'th' : 'en';
  function t() { return TRANSLATIONS[currentLang]; }
  let selectedType = 'task';
  let addingSubnoteFor = null;
  let searchQuery = '';
  let filterType = 'all';
  const TODAY = todayKey();

    boardView = view;
    boardScroll.dataset.boardView = view;
    quickFilters.querySelectorAll('.quick-filter').forEach(btn => {
      const active = btn.dataset.boardView === view;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', String(active));

    target.scrollIntoView({ behavior: 'smooth', block: 'start' });

  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';

    if (e.key === 'Enter' || e.key === ' ') {

  // --- Collapsible type picker (popover) ---
  function openTypePopover() {
    typePicker.classList.add('open');
    typeToggle.setAttribute('aria-expanded', 'true');

  function closeTypePopover() {

    typeToggle.setAttribute('aria-expanded', 'false');
  }
  function selectType(type) {
    selectedType = type;

    typePopover.querySelectorAll('.type-option').forEach(b => {

  typeToggle.addEventListener('click', (e) => {

  // --- Language ---
  function applyLang() {
    document.documentElement.setAttribute('lang', currentLang === 'th' ? 'th' : 'en');

    document.getElementById('brand-label').textContent = tr.brand;

  exportBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bullet-journal-export-' + TODAY + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error('not an array');
        if (!confirm(t().importConfirm)) return;
        entries = parsed.map(normalizeEntry);
        saveEntries(entries);
        addingSubnoteFor = null;
        render();
      } catch (err) {
        alert(t().importFailed);
      } finally {
        importFile.value = '';
      }
    };
    reader.readAsText(file);
  });

  // --- Search / Filter (sidebar history only) ---
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    render();
  });
  filterSelect.addEventListener('change', () => {
    filterType = filterSelect.value;
    render();
    if (window.matchMedia('(max-width: 860px)').matches) closeSidebar();
  });

  function matchesFilter(entry) {
    if (filterType === 'important' && !entry.important) return false;
    if (filterType !== 'all' && filterType !== 'important' && entry.type !== filterType) return false;
    if (searchQuery && !entry.text.toLowerCase().includes(searchQuery)) return false;
    return true;
  }

  // --- Add entry ---
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    entries.push({
      id: genId(),
      text,
      type: selectedType,
      date: TODAY,
      dueDate: dueDateInput.value || null,
      status: 'incomplete',
      cancelled: false,
      important: false,
      parentId: null,
      orderIndex: Date.now()
    });
    saveEntries(entries);
    input.value = '';
    dueDateInput.value = '';
    refreshDueDateVisual();
    render();
    input.focus();
  });

  // --- Mutations ---
  function cycleStatus(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry || entry.type !== 'task') return;
    const idx = STATUS_ORDER.indexOf(entry.status);
    entry.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
    saveEntries(entries);
    render();
  }

  function toggleImportant(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    entry.important = !entry.important;
    saveEntries(entries);
    render();
  }

  function toggleCancelled(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    entry.cancelled = !entry.cancelled;
    saveEntries(entries);
    render();
  }

  function deleteEntry(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    const hasChildren = entries.some(en => en.parentId === id);
    const msg = hasChildren ? t().deleteConfirmWithChildren : t().deleteConfirm;
    if (!confirm(msg)) return;
    entries = entries.filter(en => en.id !== id && en.parentId !== id);
    saveEntries(entries);
    render();
  }

  function commitEdit(entry, newText) {
    const val = newText.trim();
    if (val) entry.text = val;
    saveEntries(entries);
    render();
  }

  function startEdit(li, entry) {
    const textSpan = li.querySelector('.entry-text');
    if (!textSpan) return;
    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'edit-input';
    inputEl.value = entry.text;
    textSpan.replaceWith(inputEl);
    inputEl.focus();
    inputEl.select();

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      commitEdit(entry, inputEl.value);
    };
    const cancelEdit = () => {
      if (settled) return;
      settled = true;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });
  }

  function startAddDueDate(entry, btnEl) {
    const inputEl = document.createElement('input');
    inputEl.type = 'date';
    inputEl.className = 'edit-date-input';
    btnEl.replaceWith(inputEl);
    inputEl.focus();

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      if (inputEl.value) entry.dueDate = inputEl.value;
      saveEntries(entries);
      render();
    };
    const cancelEdit = () => {
      if (settled) return;
      settled = true;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('change', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });
  }

  function startEditDueDate(entry, badgeEl) {

    inputEl.type = 'date';
    inputEl.className = 'edit-date-input';
    inputEl.value = entry.dueDate || '';
    badgeEl.replaceWith(inputEl);
    inputEl.focus();

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;

      saveEntries(entries);
      render();
    };
    const cancelEdit = () => {
      if (settled) return;
      settled = true;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('change', commit);
    inputEl.addEventListener('keydown', (e) => {

  function createSubnoteInputRow(parentEntry) {
    const li = document.createElement('li');
    li.className = 'entry-item subnote-input-row';
    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'edit-input';

    li.appendChild(inputEl);

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      const val = inputEl.value.trim();
      if (val) {
        entries.push({
          id: genId(),
          text: val,
          type: 'note',
          date: parentEntry.date,
          dueDate: null,
          status: 'incomplete',
          cancelled: false,
          important: false,
          parentId: parentEntry.id,
          orderIndex: Date.now()
        });
        saveEntries(entries);
      }
      addingSubnoteFor = null;
      render();
    };
    const cancelAdd = () => {
      if (settled) return;
      settled = true;
      addingSubnoteFor = null;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelAdd(); }
    });

    requestAnimationFrame(() => inputEl.focus());
    return li;
  }

  function createEntryItem(entry, opts) {
    opts = opts || {};
    const isTopLevel = !entry.parentId;
    const draggable = !!(opts.draggable && isTopLevel);

    const li = document.createElement('li');
    li.className = 'entry-item';
    li.dataset.id = entry.id;
    if (entry.status === 'completed') li.classList.add('completed');
    if (entry.cancelled) li.classList.add('cancelled');
    if (entry.important) li.classList.add('important');
    if (entry.parentId) li.classList.add('sub-entry');
    li.dataset.status = entry.status;
    if (draggable) li.draggable = true;

    const tr = t();
    const bulletSymbol = entry.type === 'task' ? STATUS_SYMBOLS[entry.status] : BULLET_SYMBOLS[entry.type];
    const bulletTitle = entry.type === 'task'
      ? tr.cycleStatusTitle
      : (entry.type === 'event' ? tr.eventTitle : tr.noteTitle);

    const dragHandleHtml = draggable ? '<span class="drag-handle" title="' + escapeHtml(tr.legendDrag) + '">⋮⋮</span>' : '';
    const dueBadgeHtml = renderDueBadgeHtml(entry.dueDate);
    const dueAddBtnHtml = !entry.dueDate ? '<button type="button" class="icon-btn due-add-btn" title="' + escapeHtml(tr.setDueDate) + '">📅</button>' : '';
    const dateChipHtml = opts.showDateChip ? '<span class="date-chip">' + escapeHtml(formatDateShort(entry.date)) + '</span>' : '';

    li.innerHTML =
      dragHandleHtml +
      '<span class="bullet-mark ' + entry.type + (entry.type === 'task' ? ' clickable' : '') + '" title="' + escapeHtml(bulletTitle) + '">' + bulletSymbol + '</span>' +
      '<span class="entry-text" title="' + escapeHtml(tr.editTitle) + '">' + escapeHtml(entry.text) + '</span>' +
      dueBadgeHtml +
      dateChipHtml +
      '<button type="button" class="star-btn' + (entry.important ? ' active' : '') + '" title="' + (entry.important ? escapeHtml(tr.unmarkImportant) : escapeHtml(tr.markImportant)) + '">' + (entry.important ? '★' : '☆') + '</button>' +
      '<span class="actions">' +
        dueAddBtnHtml +
        '<button type="button" class="icon-btn cancel-btn' + (entry.cancelled ? ' active' : '') + '" title="' + (entry.cancelled ? escapeHtml(tr.uncancelEntry) : escapeHtml(tr.cancelEntry)) + '">⊘</button>' +
        (isTopLevel ? '<button type="button" class="icon-btn sub-btn" title="' + escapeHtml(tr.addSubnote) + '">+</button>' : '') +
        '<button type="button" class="icon-btn delete-btn" title="' + escapeHtml(tr.deleteTitle) + '">✕</button>' +
      '</span>';

    if (entry.type === 'task') {
      li.querySelector('.bullet-mark').addEventListener('click', () => cycleStatus(entry.id));
    }
    li.querySelector('.entry-text').addEventListener('dblclick', () => startEdit(li, entry));

    const dueBadgeEl = li.querySelector('.due-badge');
    if (dueBadgeEl) dueBadgeEl.addEventListener('dblclick', () => startEditDueDate(entry, dueBadgeEl));

    const dueAddBtn = li.querySelector('.due-add-btn');
    if (dueAddBtn) dueAddBtn.addEventListener('click', () => startAddDueDate(entry, dueAddBtn));

    li.querySelector('.star-btn').addEventListener('click', () => toggleImportant(entry.id));
    li.querySelector('.cancel-btn').addEventListener('click', () => toggleCancelled(entry.id));

    const subBtn = li.querySelector('.sub-btn');
    if (subBtn) {
      subBtn.addEventListener('click', () => {
        addingSubnoteFor = addingSubnoteFor === entry.id ? null : entry.id;
        render();
      });
    }

    li.querySelector('.delete-btn').addEventListener('click', () => deleteEntry(entry.id));

    return li;
  }

  // Renders a flat board section: top-level entries matching filterTopFn (sorted by default or manual
  // order for this section), plus their sub-notes. Records the top-level order for drag-and-drop reordering.
  function buildFlatSection(sectionKey, filterTopFn, opts) {
    let top = entries.filter(en => !en.parentId && filterTopFn(en));
    top = manualOrder[sectionKey]
      ? top.slice().sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0))
      : top.slice().sort(defaultCompare);
    sectionTopOrder[sectionKey] = top.map(e => e.id);

    const elements = [];
    top.forEach(t => {
      elements.push(createEntryItem(t, opts));
      entries.filter(en => en.parentId === t.id).forEach(k => elements.push(createEntryItem(k, opts)));
      if (addingSubnoteFor === t.id) elements.push(createSubnoteInputRow(t));
    });
    return elements;
  }

  // Renders a day's entries for the sidebar history, honoring the active search/filter.
  function buildDayEntryElements(dayEntries, applyFilter) {
    const topEntries = dayEntries.filter(en => !en.parentId);
    const childEntries = dayEntries.filter(en => en.parentId);
    const activeFilter = applyFilter && (searchQuery !== '' || filterType !== 'all');

    let topToShow = topEntries;
    if (activeFilter) {
      topToShow = topEntries.filter(top =>
        matchesFilter(top) || childEntries.some(c => c.parentId === top.id && matchesFilter(c))
      );
    }

    const elements = [];
    topToShow.forEach(top => {
      elements.push(createEntryItem(top));
      let kids = childEntries.filter(c => c.parentId === top.id);
      if (activeFilter) kids = kids.filter(matchesFilter);
      kids.forEach(k => elements.push(createEntryItem(k)));
      if (addingSubnoteFor === top.id) elements.push(createSubnoteInputRow(top));
    });
    return elements;
  }

  function renderEmpty(container, message) {
    const empty = document.createElement('li');
    empty.className = 'empty-state';
    empty.textContent = message;
    container.appendChild(empty);
  }

  // --- Drag and drop (native HTML5 DnD) ---
  function clearDragOverMarks(container) {
    container.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => {
      el.classList.remove('drag-over-top', 'drag-over-bottom');
    });
  }

  function reorderSection(sectionKey, draggedId, targetId, placeBefore) {
    const ids = (sectionTopOrder[sectionKey] || []).slice();
    const from = ids.indexOf(draggedId);
    if (from === -1) return;
    ids.splice(from, 1);
    let to = ids.indexOf(targetId);
    if (to === -1) return;
    if (!placeBefore) to += 1;
    ids.splice(to, 0, draggedId);
    ids.forEach((id, i) => {
      const en = entries.find(x => x.id === id);
      if (en) en.orderIndex = i;
    });
    manualOrder[sectionKey] = true;
    saveManualOrder();
    saveEntries(entries);
    render();
  }

  function setupDragSort(container, sectionKey) {
    let draggedId = null;

    container.addEventListener('dragstart', (e) => {
      const li = e.target.closest('.entry-item[draggable="true"]');
      if (!li) return;
      draggedId = li.dataset.id;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    });

    container.addEventListener('dragover', (e) => {
      if (!draggedId) return;
      e.preventDefault();
      const target = e.target.closest('.entry-item:not(.sub-entry)');
      clearDragOverMarks(container);
      if (!target || target.dataset.id === draggedId) return;
      const rect = target.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      target.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
    });

    container.addEventListener('dragleave', (e) => {
      if (!container.contains(e.relatedTarget)) clearDragOverMarks(container);
    });

    container.addEventListener('drop', (e) => {
      e.preventDefault();
      const target = e.target.closest('.entry-item:not(.sub-entry)');
      clearDragOverMarks(container);
      if (!draggedId || !target || target.dataset.id === draggedId) { draggedId = null; return; }
      const rect = target.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      reorderSection(sectionKey, draggedId, target.dataset.id, before);
      draggedId = null;
    });

    container.addEventListener('dragend', () => {
      clearDragOverMarks(container);
      const dragging = container.querySelector('.dragging');
      if (dragging) dragging.classList.remove('dragging');
      draggedId = null;
    });
  }

  // --- Touch-friendly row actions and long-press reordering ---
  // Native HTML5 DnD remains active for mouse/trackpad. On touch screens a tap
  // reveals row controls; holding a top-level row for 450ms starts reordering.
  function setupMobileRowActions(container, sectionKey) {
    let timer = null;
    let dragItem = null;
    let pointerId = null;
    let startX = 0;
    let startY = 0;
    let suppressClickUntil = 0;

    const isMobile = () => window.matchMedia('(max-width: 860px)').matches;
    const clearState = () => {
      if (timer) window.clearTimeout(timer);
      timer = null;
      clearDragOverMarks(container);
      if (dragItem) dragItem.classList.remove('mobile-reordering', 'dragging');
      dragItem = null;
      pointerId = null;
    };

    container.addEventListener('click', (e) => {
      if (!isMobile() || Date.now() < suppressClickUntil) return;
      const li = e.target.closest('.entry-item');
      if (!li || !container.contains(li) || e.target.closest('button, input, select, a')) return;
      document.querySelectorAll('.entry-item.mobile-actions-open').forEach(row => {
        if (row !== li) row.classList.remove('mobile-actions-open');
      });
      li.classList.toggle('mobile-actions-open');
    });

    container.addEventListener('pointerdown', (e) => {
      if (!isMobile() || e.pointerType !== 'touch' || e.target.closest('button, input, select, a')) return;
      const li = e.target.closest('.entry-item[draggable="true"]');
      if (!li || !container.contains(li)) return;
      document.body.classList.add('is-touch');
      startX = e.clientX;
      startY = e.clientY;
      pointerId = e.pointerId;
      timer = window.setTimeout(() => {
        dragItem = li;
        suppressClickUntil = Date.now() + 450;
        document.querySelectorAll('.entry-item.mobile-actions-open').forEach(row => row.classList.remove('mobile-actions-open'));
        li.classList.add('mobile-reordering', 'dragging');
        try { li.setPointerCapture(pointerId); } catch (err) {}
        if (navigator.vibrate) navigator.vibrate(15);
      }, 450);
    }, { passive: true });

    container.addEventListener('pointermove', (e) => {
      if (e.pointerId !== pointerId) return;
      if (!dragItem && timer && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
        window.clearTimeout(timer);
        timer = null;
        return;
      }
      if (!dragItem) return;
      e.preventDefault();
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.entry-item:not(.sub-entry)');
      clearDragOverMarks(container);
      if (!target || !container.contains(target) || target === dragItem) return;
      const rect = target.getBoundingClientRect();
      target.classList.add(e.clientY - rect.top < rect.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
    }, { passive: false });

    const finishTouchDrag = (e) => {
      if (e.pointerId !== pointerId) return;
      if (!dragItem) { clearState(); return; }
      e.preventDefault();
      const draggedId = dragItem.dataset.id;
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.entry-item:not(.sub-entry)');
      if (target && container.contains(target) && target !== dragItem) {
        const rect = target.getBoundingClientRect();
        const before = e.clientY - rect.top < rect.height / 2;
        clearState();
        reorderSection(sectionKey, draggedId, target.dataset.id, before);
      } else {
        clearState();
      }
      suppressClickUntil = Date.now() + 450;
    };

    container.addEventListener('pointerup', finishTouchDrag, { passive: false });
    container.addEventListener('pointercancel', clearState, { passive: true });
  }

  function render() {
    // ----- Today's Entries -----
    todayList.innerHTML = '';
    const todayTopCount = entries.filter(en => en.date === TODAY && !en.parentId).length;
    if (todayTopCount === 0) {
      renderEmpty(todayList, t().noEntriesToday);
    } else {
      buildFlatSection('today', en => en.date === TODAY, { draggable: true }).forEach(li => todayList.appendChild(li));
    }

    // ----- Daily progress bar -----
    const todayTasks = entries.filter(en => en.date === TODAY && en.type === 'task' && !en.parentId && !en.cancelled);
    const completedCount = todayTasks.filter(en => en.status === 'completed').length;
    const totalCount = todayTasks.length;
    const pct = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;
    todayProgressFill.style.width = pct + '%';
    todayProgressText.textContent = totalCount
      ? t().tasksCompleted(completedCount, totalCount, pct)
      : t().noTasksToday;
    todayProgressWrap.classList.toggle('empty', totalCount === 0);

    // ----- Incomplete Tasks (previous days, still open) -----
    incompleteList.innerHTML = '';
    const incompleteEls = buildFlatSection(
      'incomplete',
      en => en.type === 'task' && en.date !== TODAY && en.status === 'incomplete' && !en.cancelled,
      { showDateChip: true, draggable: true }
    );
    if (incompleteEls.length === 0) {
      renderEmpty(incompleteList, t().allCaughtUp);
    } else {
      incompleteEls.forEach(li => incompleteList.appendChild(li));
    }

    // ----- Upcoming / Migrated Tasks -----
    migratedList.innerHTML = '';
    const migratedEls = buildFlatSection(
      'migrated',
      en => en.type === 'task' && en.date !== TODAY && (en.status === 'migrated' || en.status === 'scheduled') && !en.cancelled,
      { showDateChip: true, draggable: true }
    );
    if (migratedEls.length === 0) {
      renderEmpty(migratedList, t().noMigrated);
    } else {
      migratedEls.forEach(li => migratedList.appendChild(li));
    }

    // ----- Sidebar History (grouped by past date) -----
    historyContainer.innerHTML = '';
    const pastDates = [...new Set(entries.filter(en => en.date !== TODAY).map(en => en.date))]
      .sort((a, b) => b.localeCompare(a));

    const activeFilter = searchQuery !== '' || filterType !== 'all';

    if (pastDates.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = t().noPastEntries;
      historyContainer.appendChild(empty);
      return;
    }

    let anyDayRendered = false;
    pastDates.forEach(dateKey => {
      const dayEntries = entries.filter(en => en.date === dateKey);
      const elements = buildDayEntryElements(dayEntries, true);
      if (activeFilter && elements.length === 0) return;

      anyDayRendered = true;
      const details = document.createElement('details');
      details.className = 'history-day';
      details.open = activeFilter;

      const summary = document.createElement('summary');

      const row = document.createElement('div');
      row.className = 'day-row';
      const labelSpan = document.createElement('span');
      labelSpan.innerHTML = '<span class="arrow">›</span>' + escapeHtml(formatDateShort(dateKey));
      labelSpan.title = formatDateLabel(dateKey);
      const countSpan = document.createElement('span');
      countSpan.className = 'count';
      countSpan.textContent = activeFilter
        ? t().matchCount(elements.length)
        : t().entryCount(dayEntries.length);
      row.appendChild(labelSpan);
      row.appendChild(countSpan);
      summary.appendChild(row);

      const preview = document.createElement('div');
      preview.className = 'day-important-preview';
      const importantOnes = dayEntries.filter(en => en.important);
      if (importantOnes.length === 0) {
        const none = document.createElement('div');
        none.className = 'imp-chip none';
        none.textContent = t().noImportantEntries;
        preview.appendChild(none);
      } else {
        importantOnes.slice(0, 4).forEach(en => {
          const chip = document.createElement('div');
          chip.className = 'imp-chip';
          chip.textContent = '★ ' + en.text;
          preview.appendChild(chip);
        });
        if (importantOnes.length > 4) {
          const more = document.createElement('div');
          more.className = 'imp-chip none';
          more.textContent = t().moreCount(importantOnes.length - 4);
          preview.appendChild(more);
        }
      }
      summary.appendChild(preview);

      const list = document.createElement('ul');
      list.className = 'entry-list';
      elements.forEach(li => list.appendChild(li));

      details.appendChild(summary);
      details.appendChild(list);
      historyContainer.appendChild(details);
    });

    if (!anyDayRendered) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = t().noPastMatch;
      historyContainer.appendChild(empty);
    }
  }

  setupDragSort(todayList, 'today');
  setupDragSort(incompleteList, 'incomplete');
  setupDragSort(migratedList, 'migrated');
  setupMobileRowActions(todayList, 'today');
  setupMobileRowActions(incompleteList, 'incomplete');
  setupMobileRowActions(migratedList, 'migrated');

  render();
</script>
</body>
</html>
