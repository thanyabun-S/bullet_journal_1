<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      if (localStorage.getItem('bulletJournalTheme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<title>Bullet Journal</title>
<style>
  :root {
    color-scheme: light;
    --bg: #FAFAFA;
    --sidebar-bg: #F5F4F1;
    --surface: #FFFFFF;
    --surface-inset: #F2F1EE;
    --border: #E8E6E1;
    --text: #2b2924;
    --text-muted: #8a8578;
    --accent: #3d5a4c;
    --accent-light: #eef2ef;
    --task-color: #3d5a4c;
    --event-color: #a35d3a;
    --note-color: #6b6355;
    --important: #b8860b;
    --important-bg: #fdf6e0;
    --danger: #b3413e;
    --overdue: #c0392b;
    --overdue-bg: #fdecea;
    --due-today: #b5651d;
    --due-today-bg: #fdf1e0;
    --hover: rgba(0,0,0,0.05);
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,0.03), 0 3px 10px rgba(0,0,0,0.03);
    --shadow-lg: 0 8px 28px rgba(0,0,0,0.08);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #171717;
    --sidebar-bg: #131313;
    --surface: #1f1f1f;
    --surface-inset: #1b1b1b;
    --border: #2c2c2c;
    --text: #ece7dc;
    --text-muted: #9b968a;
    --accent: #6fae8f;
    --accent-light: #223129;
    --task-color: #6fae8f;
    --event-color: #d68a5c;
    --note-color: #a8a190;
    --important: #e8c468;
    --important-bg: #332c17;
    --danger: #d9776f;
    --overdue: #e57373;
    --overdue-bg: #3a1f1f;
    --due-today: #e0a458;
    --due-today-bg: #3a2c14;
    --hover: rgba(255,255,255,0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 14px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Inter', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
  }

  button, input, select {
    font-family: inherit;
  }

  /* ---------- App shell ---------- */
  .app-shell {
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }

  .sidebar-overlay {
    display: none;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: background 0.2s, border-color 0.2s;
  }

  .sidebar-top {
    flex-shrink: 0;
    padding: 16px 14px 10px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .sidebar-brand h1 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .new-entry-btn {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }

  .new-entry-btn:hover { background: var(--hover); }

  .sidebar-search {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }

  #search-input, #filter-select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.82rem;
    background: var(--surface);
    color: var(--text);
    width: 100%;
  }

  #search-input:focus, #filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .sidebar-history {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px 14px;
  }

  .sidebar-history-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 8px 6px 6px;
  }

  .sidebar-bottom {
    flex-shrink: 0;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar-bottom-row {
    display: flex;
    gap: 8px;
  }

  .sidebar-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 0.78rem;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }

  .sidebar-btn:hover { background: var(--hover); }

  /* ---------- History day groups ---------- */
  .history-day {
    margin-bottom: 4px;
    border-radius: 10px;
    overflow: hidden;
  }

  .history-day summary {
    cursor: pointer;
    padding: 9px 8px;
    border-radius: 10px;
    list-style: none;
    transition: background 0.15s;
  }

  .history-day summary:hover { background: var(--hover); }

  .history-day summary::-webkit-details-marker { display: none; }

  .day-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.83rem;
    font-weight: 600;
  }

  .day-row .arrow {
    color: var(--text-muted);
    transform: rotate(0deg);
    transition: transform 0.15s;
    margin-right: 6px;
    display: inline-block;
  }

  .history-day[open] .day-row .arrow { transform: rotate(90deg); }

  .day-row .count {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 0.72rem;
  }

  .day-important-preview {
    margin-top: 4px;
    padding-left: 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .history-day[open] .day-important-preview { display: none; }

  .imp-chip {
    font-size: 0.75rem;
    color: var(--important);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .imp-chip.none {
    color: var(--text-muted);
    font-style: italic;
  }

  .history-day .entry-list {
    padding-left: 4px;
    margin-top: 2px;
  }

  .sidebar .entry-item {
    font-size: 0.82rem;
    padding: 5px 4px;
  }

  .sidebar .bullet-mark { width: 16px; font-size: 0.85rem; }

  /* ---------- Main content ---------- */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    background: var(--bg);
  }

  .main-topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }

  .icon-btn-plain {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--text);
    padding: 4px 6px;
    border-radius: 8px;
  }

  .icon-btn-plain:hover { background: var(--hover); }

  .main-topbar-date {
    font-weight: 600;
    font-size: 1rem;
  }

  .main-topbar-date .sub {
    display: block;
    font-weight: 400;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .board-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  .board-section {
    margin-bottom: 28px;
  }

  .board-section h2 {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .board-section h2 .section-badge {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--surface-inset);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
  }

  .board-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 8px 16px;
  }

  /* ---------- Daily progress bar ---------- */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: -2px 0 10px;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--surface-inset);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .progress-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .progress-wrap.empty .progress-track { opacity: 0.5; }

  .entry-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .entry-list:empty { margin: 0; }

  .entry-item {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px 8px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
    transition: box-shadow 0.1s, opacity 0.15s;
  }

  .entry-item:last-child { border-bottom: none; }

  .entry-item.sub-entry {
    padding-left: 30px;
    font-size: 0.9rem;
  }

  .entry-item.sub-entry .bullet-mark {
    color: var(--note-color);
    font-size: 0.85rem;
  }

  .entry-item.important {
    background: var(--important-bg);
    border-radius: 6px;
  }

  .entry-item.important .entry-text {
    font-weight: 600;
  }

  .entry-item.important .bullet-mark {
    color: var(--important);
  }

  .entry-item.dragging { opacity: 0.4; }
  .entry-item.drag-over-top { box-shadow: inset 0 2px 0 0 var(--accent); }
  .entry-item.drag-over-bottom { box-shadow: inset 0 -2px 0 0 var(--accent); }

  .drag-handle {
    flex-shrink: 0;
    width: 16px;
    text-align: center;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text-muted);
    cursor: grab;
    user-select: none;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .entry-item:hover .drag-handle { opacity: 1; }
  .entry-item.dragging .drag-handle { cursor: grabbing; }

  .bullet-mark {
    flex-shrink: 0;
    width: 20px;
    text-align: center;
    font-size: 1rem;
    line-height: 1.5;
    user-select: none;
    cursor: default;
    opacity: 0.9;
  }

  .bullet-mark.clickable {
    cursor: pointer;
    opacity: 1;
  }

  .bullet-mark.task { color: var(--task-color); }
  .bullet-mark.event { color: var(--event-color); }
  .bullet-mark.note { color: var(--note-color); }

  .entry-text {
    flex: 1 1 140px;
    min-width: 140px;
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
    cursor: text;
  }

  .entry-item.completed .entry-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .entry-item.cancelled .entry-text {
    text-decoration: line-through;
    opacity: 0.55;
  }

  .entry-item[data-status="migrated"] .entry-text { color: var(--event-color); }
  .entry-item[data-status="scheduled"] .entry-text { color: var(--accent); }

  .entry-item .date-chip {
    font-size: 0.68rem;
    color: var(--text-muted);
    background: var(--surface-inset);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 7px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .due-badge {
    flex-shrink: 0;
    font-size: 0.72rem;
    font-weight: 500;
    border-radius: 999px;
    padding: 1px 9px;
    margin-top: 1px;
    white-space: nowrap;
    cursor: pointer;
  }

  .due-badge.due-overdue {
    color: var(--overdue);
    background: var(--overdue-bg);
    font-weight: 700;
  }

  .due-badge.due-today {
    color: var(--due-today);
    background: var(--due-today-bg);
    font-weight: 700;
  }

  .due-badge.due-future {
    color: var(--text-muted);
    background: var(--surface-inset);
  }

  .due-add-btn {
    opacity: 0;
    transition: opacity 0.15s;
  }

  .entry-item:hover .due-add-btn { opacity: 1; }

  .edit-input, .edit-date-input {
    flex: 1;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }

  .edit-date-input { flex: none; font-size: 0.8rem; }

  .edit-input:focus, .edit-date-input:focus { outline: none; }

  .star-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text-muted);
    opacity: 0;
    padding: 0 2px;
    transition: opacity 0.15s;
  }

  .star-btn.active { color: var(--important); opacity: 1; }
  .entry-item:hover .star-btn { opacity: 1; }

  .actions {
    display: flex;
    gap: 2px;
    margin-left: auto;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .entry-item:hover .actions { opacity: 1; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.95rem;
    padding: 0 4px;
  }

  .icon-btn.cancel-btn.active { color: var(--danger); }
  .icon-btn.delete-btn:hover { color: var(--danger); }

  .subnote-input-row {
    padding-left: 30px;
    border-bottom: none;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 0.88rem;
    font-style: italic;
    padding: 14px 8px;
  }

  /* ---------- Composer (ChatGPT-style input) ---------- */
  .composer-wrap {
    flex-shrink: 0;
    padding: 10px 24px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    bottom: 0;
    background: var(--bg);
    z-index: 10;
  }

  .composer {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow-lg);
    padding: 8px 8px 8px 10px;
  }

  .type-select {
    display: flex;
    border-radius: 20px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--surface-inset);
  }

  .type-select button {
    background: transparent;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 1rem;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
  }

  .type-select button.active {
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
  }

  #entry-input {
    flex: 1;
    border: none;
    padding: 12px 8px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: transparent;
    min-width: 0;
  }

  #entry-input:focus {
    outline: none;
  }

  #due-date-input {
    border: none;
    background: var(--surface-inset);
    border-radius: 20px;
    padding: 8px 10px;
    font-size: 0.8rem;
    color: var(--text-muted);
    font-family: inherit;
    flex-shrink: 0;
    max-width: 122px;
  }

  #due-date-input:focus { outline: none; color: var(--text); }

  #add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    font-size: 1.1rem;
    cursor: pointer;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #add-btn:hover { opacity: 0.88; }

  .legend {
    display: flex;
    gap: 14px;
    font-size: 0.72rem;
    color: var(--text-muted);
    justify-content: center;
    margin-top: 10px;
    flex-wrap: wrap;
    max-width: 760px;
  }

  .legend span { display: flex; align-items: center; gap: 4px; }

  /* ---------- Mobile / responsive ---------- */
  .mobile-only { display: none; }

  @media (max-width: 860px) {
    .mobile-only { display: inline-flex; }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: var(--shadow-lg);
    }

    body.sidebar-open .sidebar {
      transform: translateX(0);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 25;
    }

    body.sidebar-open .sidebar-overlay {
      display: block;
    }

    .board-scroll { padding: 16px; }
    .composer-wrap { padding: 8px 12px 16px; }
    #due-date-input { max-width: 92px; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <h1 id="brand-label">📓 Bullet Journal</h1>
        <button type="button" class="icon-btn-plain mobile-only" id="sidebar-close" title="Close sidebar">✕</button>
      </div>
      <button type="button" class="new-entry-btn" id="focus-input-btn">✎ New entry</button>
      <div class="sidebar-search">
        <input type="text" id="search-input" placeholder="Search past entries...">
        <select id="filter-select">
          <option value="all" id="filter-opt-all">All types</option>
          <option value="task" id="filter-opt-task">Tasks</option>
          <option value="event" id="filter-opt-event">Events</option>
          <option value="note" id="filter-opt-note">Notes</option>
          <option value="important" id="filter-opt-important">Important</option>
        </select>
      </div>
    </div>

    <div class="sidebar-history">
      <div class="sidebar-history-label" id="history-label">History</div>
      <div id="history-container"></div>
    </div>

    <div class="sidebar-bottom">
      <button type="button" class="sidebar-btn" id="theme-toggle" title="Toggle dark mode">🌙 Dark mode</button>
      <button type="button" class="sidebar-btn" id="lang-toggle" title="Switch language"></button>
      <div class="sidebar-bottom-row">
        <button type="button" class="sidebar-btn" id="export-btn" title="Download entries as JSON">⬇ Export</button>
        <button type="button" class="sidebar-btn" id="import-btn" title="Restore entries from JSON">⬆ Import</button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
  </aside>

  <main class="main-content">
    <header class="main-topbar">
      <button type="button" class="icon-btn-plain mobile-only" id="sidebar-toggle" title="Open sidebar">☰</button>
      <div class="main-topbar-date">
        <span id="task-board-label">Task Board</span>
        <span class="sub" id="today-display"></span>
      </div>
    </header>

    <div class="board-scroll">
      <section class="board-section" id="today-section">
        <h2><span id="today-entries-label">Today's Entries</span> <span class="section-badge" id="today-label"></span></h2>
        <div class="progress-wrap" id="today-progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="today-progress-fill"></div></div>
          <span class="progress-text" id="today-progress-text"></span>
        </div>
        <div class="board-card">
          <ul class="entry-list" id="today-list"></ul>
        </div>
      </section>

      <section class="board-section" id="incomplete-section">
        <h2><span id="incomplete-label">Incomplete Tasks</span> <span class="section-badge" id="incomplete-badge">from previous days</span></h2>
        <div class="board-card">
          <ul class="entry-list" id="incomplete-list"></ul>
        </div>
      </section>

      <section class="board-section" id="migrated-section">
        <h2><span id="migrated-label">Upcoming / Migrated Tasks</span> <span class="section-badge">&gt; / &lt;</span></h2>
        <div class="board-card">
          <ul class="entry-list" id="migrated-list"></ul>
        </div>
      </section>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="entry-form">
        <div class="type-select" id="type-select">
          <button type="button" data-type="task" class="active" title="Task">•</button>
          <button type="button" data-type="event" title="Event">○</button>
          <button type="button" data-type="note" title="Note">–</button>
        </div>
        <input type="text" id="entry-input" placeholder="Add a task, event, or note for today..." autocomplete="off">
        <input type="date" id="due-date-input" title="Due date (optional)">

      locale: 'th-TH'

  };

  function genId() {
    return Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatDateLabel(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString(t().locale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function formatDateShort(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString(t().locale, { month: 'short', day: 'numeric' });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function dueDateStatus(dueDate) {
    if (!dueDate) return null;
    if (dueDate < TODAY) return 'overdue';
    if (dueDate === TODAY) return 'today';
    return 'future';
  }

  function renderDueBadgeHtml(dueDate) {
    if (!dueDate) return '';
    const status = dueDateStatus(dueDate);
    const icon = status === 'overdue' ? '⚠' : '📅';
    return '<span class="due-badge due-' + status + '" title="' + escapeHtml(t().dueTitle) + escapeHtml(formatDateLabel(dueDate)) + '">'
      + icon + ' ' + escapeHtml(formatDateShort(dueDate)) + '</span>';
  }

  function dueBucketRank(dueDate) {
    if (!dueDate) return 3;
    const status = dueDateStatus(dueDate);
    return status === 'overdue' ? 0 : (status === 'today' ? 1 : 2);
  }

  function defaultCompare(a, b) {
    const ai = a.important ? 0 : 1, bi = b.important ? 0 : 1;
    if (ai !== bi) return ai - bi;
    const ar = dueBucketRank(a.dueDate), br = dueBucketRank(b.dueDate);
    if (ar !== br) return ar - br;
    if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
    return (a.orderIndex || 0) - (b.orderIndex || 0);
  }

  function normalizeEntry(e) {
    return {
      id: e.id || genId(),
      text: e.text || '',
      type: (e.type === 'task' || e.type === 'event' || e.type === 'note') ? e.type : 'note',
      date: e.date || todayKey(),
      dueDate: e.dueDate || null,
      status: STATUS_ORDER.includes(e.status) ? e.status : (e.completed ? 'completed' : 'incomplete'),
      cancelled: !!e.cancelled,
      important: !!e.important,
      parentId: e.parentId || null,
      orderIndex: typeof e.orderIndex === 'number' ? e.orderIndex : Date.now()
    };
  }

  function loadEntries() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      return raw.map(normalizeEntry);
    } catch (e) {
      return [];
    }
  }

  function saveEntries(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function loadManualOrder() {
    try {
      return Object.assign({ today: false, incomplete: false, migrated: false }, JSON.parse(localStorage.getItem(MANUAL_ORDER_KEY)) || {});
    } catch (e) {
      return { today: false, incomplete: false, migrated: false };
    }
  }

  function saveManualOrder() {
    localStorage.setItem(MANUAL_ORDER_KEY, JSON.stringify(manualOrder));
  }

  let entries = loadEntries();
  let manualOrder = loadManualOrder();
  let currentLang = localStorage.getItem(LANG_KEY) === 'th' ? 'th' : 'en';
  function t() { return TRANSLATIONS[currentLang]; }
  let selectedType = 'task';
  let addingSubnoteFor = null;
  let searchQuery = '';
  let filterType = 'all';
  const TODAY = todayKey();
  const sectionTopOrder = { today: [], incomplete: [], migrated: [] };

  const form = document.getElementById('entry-form');
  const input = document.getElementById('entry-input');
  const dueDateInput = document.getElementById('due-date-input');
  const typeSelect = document.getElementById('type-select');
  const todayList = document.getElementById('today-list');
  const incompleteList = document.getElementById('incomplete-list');
  const migratedList = document.getElementById('migrated-list');
  const historyContainer = document.getElementById('history-container');
  const todayDisplay = document.getElementById('today-display');
  const todayLabel = document.getElementById('today-label');
  const todayProgressWrap = document.getElementById('today-progress-wrap');
  const todayProgressFill = document.getElementById('today-progress-fill');
  const todayProgressText = document.getElementById('today-progress-text');
  const themeToggle = document.getElementById('theme-toggle');
  const langToggle = document.getElementById('lang-toggle');
  const exportBtn = document.getElementById('export-btn');
  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');
  const searchInput = document.getElementById('search-input');
  const filterSelect = document.getElementById('filter-select');
  const focusInputBtn = document.getElementById('focus-input-btn');
  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const sidebarClose = document.getElementById('sidebar-close');
  const sidebarOverlay = document.getElementById('sidebar-overlay');

  // --- Mobile sidebar toggle ---
  function openSidebar() { document.body.classList.add('sidebar-open'); }
  function closeSidebar() { document.body.classList.remove('sidebar-open'); }
  sidebarToggle.addEventListener('click', openSidebar);
  sidebarClose.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  focusInputBtn.addEventListener('click', () => { input.focus(); closeSidebar(); });

  // --- Theme ---
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? t().lightMode : t().darkMode;
  }
  let currentTheme = localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light';
  applyTheme(currentTheme);
  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, currentTheme);
    applyTheme(currentTheme);
  });

  // --- Language ---
  function applyLang() {
    document.documentElement.setAttribute('lang', currentLang === 'th' ? 'th' : 'en');
    const tr = t();
    document.getElementById('brand-label').textContent = tr.brand;
    focusInputBtn.textContent = tr.newEntry;
    searchInput.placeholder = tr.searchPlaceholder;
    document.getElementById('filter-opt-all').textContent = tr.filterAll;
    document.getElementById('filter-opt-task').textContent = tr.filterTask;
    document.getElementById('filter-opt-event').textContent = tr.filterEvent;
    document.getElementById('filter-opt-note').textContent = tr.filterNote;
    document.getElementById('filter-opt-important').textContent = tr.filterImportant;
    document.getElementById('history-label').textContent = tr.history;
    themeToggle.textContent = currentTheme === 'dark' ? tr.lightMode : tr.darkMode;
    themeToggle.title = tr.toggleDarkMode;
    langToggle.textContent = tr.langToggle;
    langToggle.title = tr.toggleLang;
    exportBtn.textContent = tr.exportBtn;
    exportBtn.title = tr.exportTitle;
    importBtn.textContent = tr.importBtn;
    importBtn.title = tr.importTitle;
    sidebarClose.title = tr.closeSidebar;
    sidebarToggle.title = tr.openSidebar;
    document.getElementById('task-board-label').textContent = tr.taskBoard;
    document.getElementById('today-entries-label').textContent = tr.todayEntries;
    document.getElementById('incomplete-label').textContent = tr.incompleteTasks;
    document.getElementById('incomplete-badge').textContent = tr.fromPreviousDays;
    document.getElementById('migrated-label').textContent = tr.migratedTasks;
    input.placeholder = tr.entryPlaceholder;
    dueDateInput.title = tr.dueDateOptional;
    document.getElementById('add-btn').title = tr.addEntryTitle;
    typeSelect.querySelector('[data-type="task"]').title = tr.typeTask;
    typeSelect.querySelector('[data-type="event"]').title = tr.typeEvent;
    typeSelect.querySelector('[data-type="note"]').title = tr.typeNote;
    document.getElementById('legend').innerHTML =
      '<span>' + tr.legendTask + '</span>' +
      '<span>' + tr.legendEvent + '</span>' +
      '<span>' + tr.legendNote + '</span>' +
      '<span>' + tr.legendImportant + '</span>' +
      '<span>' + tr.legendCancel + '</span>' +
      '<span>' + tr.legendDrag + '</span>' +
      '<span>' + tr.legendDue + '</span>' +
      '<span>' + tr.legendEdit + '</span>';
    todayDisplay.textContent = formatDateLabel(TODAY);
    todayLabel.textContent = formatDateShort(TODAY);
  }
  applyLang();
  langToggle.addEventListener('click', () => {
    currentLang = currentLang === 'th' ? 'en' : 'th';
    localStorage.setItem(LANG_KEY, currentLang);
    applyLang();
    render();
  });

  // --- Export / Import ---
  exportBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bullet-journal-export-' + TODAY + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error('not an array');
        if (!confirm(t().importConfirm)) return;
        entries = parsed.map(normalizeEntry);
        saveEntries(entries);
        addingSubnoteFor = null;
        render();
      } catch (err) {
        alert(t().importFailed);
      } finally {
        importFile.value = '';
      }
    };
    reader.readAsText(file);
  });

  // --- Search / Filter (sidebar history only) ---
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    render();
  });
  filterSelect.addEventListener('change', () => {
    filterType = filterSelect.value;
    render();
  });

  function matchesFilter(entry) {
    if (filterType === 'important' && !entry.important) return false;
    if (filterType !== 'all' && filterType !== 'important' && entry.type !== filterType) return false;
    if (searchQuery && !entry.text.toLowerCase().includes(searchQuery)) return false;
    return true;
  }

  // --- Type selector ---
  typeSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    selectedType = btn.dataset.type;
    typeSelect.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  });

  // --- Add entry ---
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    entries.push({
      id: genId(),
      text,
      type: selectedType,
      date: TODAY,
      dueDate: dueDateInput.value || null,
      status: 'incomplete',
      cancelled: false,
      important: false,
      parentId: null,
      orderIndex: Date.now()
    });
    saveEntries(entries);
    input.value = '';
    dueDateInput.value = '';
    render();
    input.focus();
  });

  // --- Mutations ---
  function cycleStatus(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry || entry.type !== 'task') return;
    const idx = STATUS_ORDER.indexOf(entry.status);
    entry.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
    saveEntries(entries);
    render();
  }

  function toggleImportant(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    entry.important = !entry.important;
    saveEntries(entries);
    render();
  }

  function toggleCancelled(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    entry.cancelled = !entry.cancelled;
    saveEntries(entries);
    render();
  }

  function deleteEntry(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    const hasChildren = entries.some(en => en.parentId === id);
    const msg = hasChildren ? t().deleteConfirmWithChildren : t().deleteConfirm;
    if (!confirm(msg)) return;
    entries = entries.filter(en => en.id !== id && en.parentId !== id);
    saveEntries(entries);
    render();
  }

  function commitEdit(entry, newText) {
    const val = newText.trim();
    if (val) entry.text = val;
    saveEntries(entries);
    render();
  }

  function startEdit(li, entry) {
    const textSpan = li.querySelector('.entry-text');
    if (!textSpan) return;
    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'edit-input';
    inputEl.value = entry.text;
    textSpan.replaceWith(inputEl);
    inputEl.focus();
    inputEl.select();

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      commitEdit(entry, inputEl.value);
    };
    const cancelEdit = () => {
      if (settled) return;
      settled = true;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });
  }

  function startAddDueDate(entry, btnEl) {
    const inputEl = document.createElement('input');
    inputEl.type = 'date';
    inputEl.className = 'edit-date-input';
    btnEl.replaceWith(inputEl);
    inputEl.focus();

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      if (inputEl.value) entry.dueDate = inputEl.value;
      saveEntries(entries);
      render();
    };
    const cancelEdit = () => {
      if (settled) return;
      settled = true;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('change', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });
  }

  function startEditDueDate(entry, badgeEl) {
    const inputEl = document.createElement('input');
    inputEl.type = 'date';
    inputEl.className = 'edit-date-input';
    inputEl.value = entry.dueDate || '';
    badgeEl.replaceWith(inputEl);
    inputEl.focus();

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      entry.dueDate = inputEl.value || null;
      saveEntries(entries);
      render();
    };
    const cancelEdit = () => {
      if (settled) return;
      settled = true;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('change', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });
  }

  function createSubnoteInputRow(parentEntry) {
    const li = document.createElement('li');
    li.className = 'entry-item subnote-input-row';
    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'edit-input';
    inputEl.placeholder = t().subnotePlaceholder;
    li.appendChild(inputEl);

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      const val = inputEl.value.trim();
      if (val) {
        entries.push({
          id: genId(),
          text: val,
          type: 'note',
          date: parentEntry.date,
          dueDate: null,
          status: 'incomplete',
          cancelled: false,
          important: false,
          parentId: parentEntry.id,
          orderIndex: Date.now()
        });
        saveEntries(entries);
      }
      addingSubnoteFor = null;
      render();
    };
    const cancelAdd = () => {
      if (settled) return;
      settled = true;
      addingSubnoteFor = null;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelAdd(); }
    });

    requestAnimationFrame(() => inputEl.focus());
    return li;
  }

  function createEntryItem(entry, opts) {
    opts = opts || {};
    const isTopLevel = !entry.parentId;
    const draggable = !!(opts.draggable && isTopLevel);

    const li = document.createElement('li');
    li.className = 'entry-item';
    li.dataset.id = entry.id;
    if (entry.status === 'completed') li.classList.add('completed');
    if (entry.cancelled) li.classList.add('cancelled');
    if (entry.important) li.classList.add('important');
    if (entry.parentId) li.classList.add('sub-entry');
    li.dataset.status = entry.status;
    if (draggable) li.draggable = true;

    const tr = t();
    const bulletSymbol = entry.type === 'task' ? STATUS_SYMBOLS[entry.status] : BULLET_SYMBOLS[entry.type];
    const bulletTitle = entry.type === 'task'
      ? tr.cycleStatusTitle
      : (entry.type === 'event' ? tr.eventTitle : tr.noteTitle);

    const dragHandleHtml = draggable ? '<span class="drag-handle" title="' + escapeHtml(tr.legendDrag) + '">⋮⋮</span>' : '';
    const dueBadgeHtml = renderDueBadgeHtml(entry.dueDate);
    const dueAddBtnHtml = !entry.dueDate ? '<button type="button" class="icon-btn due-add-btn" title="' + escapeHtml(tr.setDueDate) + '">📅</button>' : '';
    const dateChipHtml = opts.showDateChip ? '<span class="date-chip">' + escapeHtml(formatDateShort(entry.date)) + '</span>' : '';

    li.innerHTML =
      dragHandleHtml +
      '<span class="bullet-mark ' + entry.type + (entry.type === 'task' ? ' clickable' : '') + '" title="' + escapeHtml(bulletTitle) + '">' + bulletSymbol + '</span>' +
      '<span class="entry-text" title="' + escapeHtml(tr.editTitle) + '">' + escapeHtml(entry.text) + '</span>' +
      dueBadgeHtml +
      dateChipHtml +
      '<button type="button" class="star-btn' + (entry.important ? ' active' : '') + '" title="' + (entry.important ? escapeHtml(tr.unmarkImportant) : escapeHtml(tr.markImportant)) + '">' + (entry.important ? '★' : '☆') + '</button>' +
      '<span class="actions">' +
        dueAddBtnHtml +
        '<button type="button" class="icon-btn cancel-btn' + (entry.cancelled ? ' active' : '') + '" title="' + (entry.cancelled ? escapeHtml(tr.uncancelEntry) : escapeHtml(tr.cancelEntry)) + '">⊘</button>' +
        (isTopLevel ? '<button type="button" class="icon-btn sub-btn" title="' + escapeHtml(tr.addSubnote) + '">+</button>' : '') +
        '<button type="button" class="icon-btn delete-btn" title="' + escapeHtml(tr.deleteTitle) + '">✕</button>' +
      '</span>';

    if (entry.type === 'task') {
      li.querySelector('.bullet-mark').addEventListener('click', () => cycleStatus(entry.id));
    }
    li.querySelector('.entry-text').addEventListener('dblclick', () => startEdit(li, entry));

    const dueBadgeEl = li.querySelector('.due-badge');
    if (dueBadgeEl) dueBadgeEl.addEventListener('dblclick', () => startEditDueDate(entry, dueBadgeEl));

    const dueAddBtn = li.querySelector('.due-add-btn');
    if (dueAddBtn) dueAddBtn.addEventListener('click', () => startAddDueDate(entry, dueAddBtn));

    li.querySelector('.star-btn').addEventListener('click', () => toggleImportant(entry.id));
    li.querySelector('.cancel-btn').addEventListener('click', () => toggleCancelled(entry.id));

    const subBtn = li.querySelector('.sub-btn');
    if (subBtn) {
      subBtn.addEventListener('click', () => {
        addingSubnoteFor = addingSubnoteFor === entry.id ? null : entry.id;
        render();
      });
    }

    li.querySelector('.delete-btn').addEventListener('click', () => deleteEntry(entry.id));

    return li;
  }

  // Renders a flat board section: top-level entries matching filterTopFn (sorted by default or manual
  // order for this section), plus their sub-notes. Records the top-level order for drag-and-drop reordering.
  function buildFlatSection(sectionKey, filterTopFn, opts) {
    let top = entries.filter(en => !en.parentId && filterTopFn(en));
    top = manualOrder[sectionKey]
      ? top.slice().sort((a, b) => (a.orderIndex || 0) - (b.orderIndex || 0))
      : top.slice().sort(defaultCompare);
    sectionTopOrder[sectionKey] = top.map(e => e.id);

    const elements = [];
    top.forEach(t => {
      elements.push(createEntryItem(t, opts));
      entries.filter(en => en.parentId === t.id).forEach(k => elements.push(createEntryItem(k, opts)));
      if (addingSubnoteFor === t.id) elements.push(createSubnoteInputRow(t));
    });
    return elements;
  }

  // Renders a day's entries for the sidebar history, honoring the active search/filter.
  function buildDayEntryElements(dayEntries, applyFilter) {
    const topEntries = dayEntries.filter(en => !en.parentId);
    const childEntries = dayEntries.filter(en => en.parentId);
    const activeFilter = applyFilter && (searchQuery !== '' || filterType !== 'all');

    let topToShow = topEntries;
    if (activeFilter) {
      topToShow = topEntries.filter(top =>
        matchesFilter(top) || childEntries.some(c => c.parentId === top.id && matchesFilter(c))
      );
    }

    const elements = [];
    topToShow.forEach(top => {
      elements.push(createEntryItem(top));
      let kids = childEntries.filter(c => c.parentId === top.id);
      if (activeFilter) kids = kids.filter(matchesFilter);
      kids.forEach(k => elements.push(createEntryItem(k)));
      if (addingSubnoteFor === top.id) elements.push(createSubnoteInputRow(top));
    });
    return elements;
  }

  function renderEmpty(container, message) {
    const empty = document.createElement('li');
    empty.className = 'empty-state';
    empty.textContent = message;
    container.appendChild(empty);
  }

  // --- Drag and drop (native HTML5 DnD) ---
  function clearDragOverMarks(container) {
    container.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => {
      el.classList.remove('drag-over-top', 'drag-over-bottom');
    });
  }

  function reorderSection(sectionKey, draggedId, targetId, placeBefore) {
    const ids = (sectionTopOrder[sectionKey] || []).slice();
    const from = ids.indexOf(draggedId);
    if (from === -1) return;
    ids.splice(from, 1);
    let to = ids.indexOf(targetId);
    if (to === -1) return;
    if (!placeBefore) to += 1;
    ids.splice(to, 0, draggedId);
    ids.forEach((id, i) => {
      const en = entries.find(x => x.id === id);
      if (en) en.orderIndex = i;
    });
    manualOrder[sectionKey] = true;
    saveManualOrder();
    saveEntries(entries);
    render();
  }

  function setupDragSort(container, sectionKey) {
    let draggedId = null;

    container.addEventListener('dragstart', (e) => {
      const li = e.target.closest('.entry-item[draggable="true"]');
      if (!li) return;
      draggedId = li.dataset.id;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    });

    container.addEventListener('dragover', (e) => {
      if (!draggedId) return;
      e.preventDefault();
      const target = e.target.closest('.entry-item:not(.sub-entry)');
      clearDragOverMarks(container);
      if (!target || target.dataset.id === draggedId) return;
      const rect = target.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      target.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
    });

    container.addEventListener('dragleave', (e) => {
      if (!container.contains(e.relatedTarget)) clearDragOverMarks(container);
    });

    container.addEventListener('drop', (e) => {
      e.preventDefault();
      const target = e.target.closest('.entry-item:not(.sub-entry)');
      clearDragOverMarks(container);
      if (!draggedId || !target || target.dataset.id === draggedId) { draggedId = null; return; }
      const rect = target.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      reorderSection(sectionKey, draggedId, target.dataset.id, before);
      draggedId = null;
    });

    container.addEventListener('dragend', () => {
      clearDragOverMarks(container);
      const dragging = container.querySelector('.dragging');
      if (dragging) dragging.classList.remove('dragging');
      draggedId = null;
    });
  }

  function render() {
    // ----- Today's Entries -----
    todayList.innerHTML = '';
    const todayTopCount = entries.filter(en => en.date === TODAY && !en.parentId).length;
    if (todayTopCount === 0) {
      renderEmpty(todayList, t().noEntriesToday);
    } else {
      buildFlatSection('today', en => en.date === TODAY, { draggable: true }).forEach(li => todayList.appendChild(li));
    }

    // ----- Daily progress bar -----
    const todayTasks = entries.filter(en => en.date === TODAY && en.type === 'task' && !en.parentId && !en.cancelled);
    const completedCount = todayTasks.filter(en => en.status === 'completed').length;
    const totalCount = todayTasks.length;
    const pct = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;
    todayProgressFill.style.width = pct + '%';
    todayProgressText.textContent = totalCount
      ? t().tasksCompleted(completedCount, totalCount, pct)
      : t().noTasksToday;
    todayProgressWrap.classList.toggle('empty', totalCount === 0);

    // ----- Incomplete Tasks (previous days, still open) -----
    incompleteList.innerHTML = '';
    const incompleteEls = buildFlatSection(
      'incomplete',
      en => en.type === 'task' && en.date !== TODAY && en.status === 'incomplete' && !en.cancelled,
      { showDateChip: true, draggable: true }
    );
    if (incompleteEls.length === 0) {
      renderEmpty(incompleteList, t().allCaughtUp);
    } else {
      incompleteEls.forEach(li => incompleteList.appendChild(li));
    }

    // ----- Upcoming / Migrated Tasks -----
    migratedList.innerHTML = '';
    const migratedEls = buildFlatSection(
      'migrated',
      en => en.type === 'task' && en.date !== TODAY && (en.status === 'migrated' || en.status === 'scheduled') && !en.cancelled,
      { showDateChip: true, draggable: true }
    );
    if (migratedEls.length === 0) {
      renderEmpty(migratedList, t().noMigrated);
    } else {
      migratedEls.forEach(li => migratedList.appendChild(li));
    }

    // ----- Sidebar History (grouped by past date) -----
    historyContainer.innerHTML = '';
    const pastDates = [...new Set(entries.filter(en => en.date !== TODAY).map(en => en.date))]
      .sort((a, b) => b.localeCompare(a));

    const activeFilter = searchQuery !== '' || filterType !== 'all';

    if (pastDates.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = t().noPastEntries;
      historyContainer.appendChild(empty);
      return;
    }

    let anyDayRendered = false;
    pastDates.forEach(dateKey => {
      const dayEntries = entries.filter(en => en.date === dateKey);
      const elements = buildDayEntryElements(dayEntries, true);
      if (activeFilter && elements.length === 0) return;

      anyDayRendered = true;
      const details = document.createElement('details');
      details.className = 'history-day';
      details.open = activeFilter;

      const summary = document.createElement('summary');

      const row = document.createElement('div');
      row.className = 'day-row';
      const labelSpan = document.createElement('span');
      labelSpan.innerHTML = '<span class="arrow">›</span>' + escapeHtml(formatDateShort(dateKey));
      labelSpan.title = formatDateLabel(dateKey);
      const countSpan = document.createElement('span');
      countSpan.className = 'count';
      countSpan.textContent = activeFilter
        ? t().matchCount(elements.length)
        : t().entryCount(dayEntries.length);
      row.appendChild(labelSpan);
      row.appendChild(countSpan);
      summary.appendChild(row);

      const preview = document.createElement('div');
      preview.className = 'day-important-preview';
      const importantOnes = dayEntries.filter(en => en.important);
      if (importantOnes.length === 0) {
        const none = document.createElement('div');
        none.className = 'imp-chip none';
        none.textContent = t().noImportantEntries;
        preview.appendChild(none);
      } else {
        importantOnes.slice(0, 4).forEach(en => {
          const chip = document.createElement('div');
          chip.className = 'imp-chip';
          chip.textContent = '★ ' + en.text;
          preview.appendChild(chip);
        });
        if (importantOnes.length > 4) {
          const more = document.createElement('div');
          more.className = 'imp-chip none';
          more.textContent = t().moreCount(importantOnes.length - 4);
          preview.appendChild(more);
        }
      }
      summary.appendChild(preview);

      const list = document.createElement('ul');
      list.className = 'entry-list';
      elements.forEach(li => list.appendChild(li));

      details.appendChild(summary);
      details.appendChild(list);
      historyContainer.appendChild(details);
    });

    if (!anyDayRendered) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = t().noPastMatch;
      historyContainer.appendChild(empty);
    }
  }

  setupDragSort(todayList, 'today');
  setupDragSort(incompleteList, 'incomplete');
  setupDragSort(migratedList, 'migrated');

  render();
</script>
</body>
</html>
