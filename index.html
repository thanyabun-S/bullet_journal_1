<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    try {
      if (localStorage.getItem('bulletJournalTheme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<title>Bullet Journal</title>
<style>
  :root {
    --bg: #ffffff;
    --sidebar-bg: #f5f4f0;
    --surface: #ffffff;
    --surface-inset: #f7f6f3;
    --border: #e6e3dd;
    --text: #2b2924;
    --text-muted: #8a8578;
    --accent: #3d5a4c;
    --accent-light: #eef2ef;
    --task-color: #3d5a4c;
    --event-color: #a35d3a;
    --note-color: #6b6355;
    --important: #b8860b;
    --important-bg: #fdf6e0;
    --danger: #b3413e;
    --hover: rgba(0,0,0,0.05);
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
  }

  :root[data-theme="dark"] {
    --bg: #212121;
    --sidebar-bg: #171717;
    --surface: #2a2a28;
    --surface-inset: #262625;
    --border: #3a3937;
    --text: #ece7dc;
    --text-muted: #9b968a;
    --accent: #6fae8f;
    --accent-light: #223129;
    --task-color: #6fae8f;
    --event-color: #d68a5c;
    --note-color: #a8a190;
    --important: #e8c468;
    --important-bg: #332c17;
    --danger: #d9776f;
    --hover: rgba(255,255,255,0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 14px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  button, input, select {
    font-family: inherit;
  }

  /* ---------- App shell ---------- */
  .app-shell {
    display: flex;
    height: 100dvh;
    overflow: hidden;
  }

  .sidebar-overlay {
    display: none;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: background 0.2s, border-color 0.2s;
  }

  .sidebar-top {
    flex-shrink: 0;
    padding: 16px 14px 10px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .sidebar-brand h1 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .new-entry-btn {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }

  .new-entry-btn:hover { background: var(--hover); }

  .sidebar-search {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }

  #search-input, #filter-select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.82rem;
    background: var(--surface);
    color: var(--text);
    width: 100%;
  }

  #search-input:focus, #filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .sidebar-history {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px 14px;
  }

  .sidebar-history-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 8px 6px 6px;
  }

  .sidebar-bottom {
    flex-shrink: 0;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar-bottom-row {
    display: flex;
    gap: 8px;
  }

  .sidebar-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 0.78rem;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }

  .sidebar-btn:hover { background: var(--hover); }

  /* ---------- History day groups ---------- */
  .history-day {
    margin-bottom: 4px;
    border-radius: 10px;
    overflow: hidden;
  }

  .history-day summary {
    cursor: pointer;
    padding: 9px 8px;
    border-radius: 10px;
    list-style: none;
    transition: background 0.15s;
  }

  .history-day summary:hover { background: var(--hover); }

  .history-day summary::-webkit-details-marker { display: none; }

  .day-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.83rem;
    font-weight: 600;
  }

  .day-row .arrow {
    color: var(--text-muted);
    transform: rotate(0deg);
    transition: transform 0.15s;
    margin-right: 6px;
    display: inline-block;
  }

  .history-day[open] .day-row .arrow { transform: rotate(90deg); }

  .day-row .count {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 0.72rem;
  }

  .day-important-preview {
    margin-top: 4px;
    padding-left: 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .history-day[open] .day-important-preview { display: none; }

  .imp-chip {
    font-size: 0.75rem;
    color: var(--important);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .imp-chip.none {
    color: var(--text-muted);
    font-style: italic;
  }

  .history-day .entry-list {
    padding-left: 4px;
    margin-top: 2px;
  }

  .sidebar .entry-item {
    font-size: 0.82rem;
    padding: 5px 4px;
  }

  .sidebar .bullet-mark { width: 16px; font-size: 0.85rem; }

  /* ---------- Main content ---------- */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    background: var(--bg);
  }

  .main-topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }

  .icon-btn-plain {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--text);
    padding: 4px 6px;
    border-radius: 8px;
  }

  .icon-btn-plain:hover { background: var(--hover); }

  .main-topbar-date {
    font-weight: 600;
    font-size: 1rem;
  }

  .main-topbar-date .sub {
    display: block;
    font-weight: 400;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .board-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  .board-section {
    margin-bottom: 28px;
  }

  .board-section h2 {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .board-section h2 .section-badge {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--surface-inset);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
  }

  .board-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 8px 16px;
  }

  .entry-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .entry-list:empty { margin: 0; }

  .entry-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }

  .entry-item:last-child { border-bottom: none; }

  .entry-item.sub-entry {
    padding-left: 30px;
    font-size: 0.9rem;
  }

  .entry-item.sub-entry .bullet-mark {
    color: var(--note-color);
    font-size: 0.85rem;
  }

  .entry-item.important {
    background: var(--important-bg);
    border-radius: 6px;
  }

  .entry-item.important .entry-text {
    font-weight: 600;
  }

  .entry-item.important .bullet-mark {
    color: var(--important);
  }

  .bullet-mark {
    flex-shrink: 0;
    width: 20px;
    text-align: center;
    font-size: 1rem;
    line-height: 1.5;
    user-select: none;
    cursor: default;
    opacity: 0.9;
  }

  .bullet-mark.clickable {
    cursor: pointer;
    opacity: 1;
  }

  .bullet-mark.task { color: var(--task-color); }
  .bullet-mark.event { color: var(--event-color); }
  .bullet-mark.note { color: var(--note-color); }

  .entry-text {
    flex: 1;
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
    cursor: text;
  }

  .entry-item.completed .entry-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .entry-item.cancelled .entry-text {
    text-decoration: line-through;
    opacity: 0.55;
  }

  .entry-item[data-status="migrated"] .entry-text { color: var(--event-color); }
  .entry-item[data-status="scheduled"] .entry-text { color: var(--accent); }

  .entry-item .date-chip {
    font-size: 0.68rem;
    color: var(--text-muted);
    background: var(--surface-inset);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 7px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .edit-input {
    flex: 1;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }

  .edit-input:focus { outline: none; }

  .star-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--text-muted);
    opacity: 0.45;
    padding: 0 2px;
    transition: opacity 0.15s;
  }

  .star-btn.active { color: var(--important); opacity: 1; }
  .entry-item:hover .star-btn { opacity: 1; }

  .actions {
    display: flex;
    gap: 2px;
    margin-left: auto;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .entry-item:hover .actions { opacity: 1; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.95rem;
    padding: 0 4px;
  }

  .icon-btn.cancel-btn.active { color: var(--danger); }
  .icon-btn.delete-btn:hover { color: var(--danger); }

  .subnote-input-row {
    padding-left: 30px;
    border-bottom: none;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 0.88rem;
    font-style: italic;
    padding: 14px 8px;
  }

  /* ---------- Composer (ChatGPT-style input) ---------- */
  .composer-wrap {
    flex-shrink: 0;
    padding: 10px 24px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: sticky;
    bottom: 0;
    background: var(--bg);
    z-index: 10;
  }

  .composer {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow-lg);
    padding: 8px 8px 8px 10px;
  }

  .type-select {
    display: flex;
    border-radius: 20px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--surface-inset);
  }

  .type-select button {
    background: transparent;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 1rem;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
  }

  .type-select button.active {
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
  }

  #entry-input {
    flex: 1;
    border: none;
    padding: 12px 8px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: transparent;
    min-width: 0;
  }

  #entry-input:focus {
    outline: none;
  }

  #add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    font-size: 1.1rem;
    cursor: pointer;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #add-btn:hover { opacity: 0.88; }

  .legend {
    display: flex;
    gap: 14px;
    font-size: 0.72rem;
    color: var(--text-muted);
    justify-content: center;
    margin-top: 10px;
    flex-wrap: wrap;
    max-width: 760px;
  }

  .legend span { display: flex; align-items: center; gap: 4px; }

  /* ---------- Mobile / responsive ---------- */
  .mobile-only { display: none; }

  @media (max-width: 860px) {
    .mobile-only { display: inline-flex; }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: var(--shadow-lg);
    }

    body.sidebar-open .sidebar {
      transform: translateX(0);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 25;
    }

    body.sidebar-open .sidebar-overlay {
      display: block;
    }

    .board-scroll { padding: 16px; }
    .composer-wrap { padding: 8px 12px 16px; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <h1>📓 Bullet Journal</h1>
        <button type="button" class="icon-btn-plain mobile-only" id="sidebar-close" title="Close sidebar">✕</button>
      </div>
      <button type="button" class="new-entry-btn" id="focus-input-btn">✎ New entry</button>
      <div class="sidebar-search">
        <input type="text" id="search-input" placeholder="Search past entries...">
        <select id="filter-select">
          <option value="all">All types</option>
          <option value="task">Tasks</option>
          <option value="event">Events</option>
          <option value="note">Notes</option>
          <option value="important">Important</option>
        </select>
      </div>
    </div>

    <div class="sidebar-history">
      <div class="sidebar-history-label">History</div>
      <div id="history-container"></div>
    </div>

    <div class="sidebar-bottom">
      <button type="button" class="sidebar-btn" id="theme-toggle" title="Toggle dark mode">🌙 Dark mode</button>
      <div class="sidebar-bottom-row">
        <button type="button" class="sidebar-btn" id="export-btn" title="Download entries as JSON">⬇ Export</button>
        <button type="button" class="sidebar-btn" id="import-btn" title="Restore entries from JSON">⬆ Import</button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
  </aside>

  <main class="main-content">
    <header class="main-topbar">
      <button type="button" class="icon-btn-plain mobile-only" id="sidebar-toggle" title="Open sidebar">☰</button>
      <div class="main-topbar-date">
        Task Board
        <span class="sub" id="today-display"></span>
      </div>
    </header>

    <div class="board-scroll">
      <section class="board-section" id="today-section">
        <h2>Today's Entries <span class="section-badge" id="today-label"></span></h2>
        <div class="board-card">
          <ul class="entry-list" id="today-list"></ul>
        </div>
      </section>

      <section class="board-section" id="incomplete-section">
        <h2>Incomplete Tasks <span class="section-badge">from previous days</span></h2>
        <div class="board-card">
          <ul class="entry-list" id="incomplete-list"></ul>
        </div>
      </section>

      <section class="board-section" id="migrated-section">
        <h2>Upcoming / Migrated Tasks <span class="section-badge">&gt; / &lt;</span></h2>
        <div class="board-card">
          <ul class="entry-list" id="migrated-list"></ul>
        </div>
      </section>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="entry-form">
        <div class="type-select" id="type-select">
          <button type="button" data-type="task" class="active" title="Task">•</button>
          <button type="button" data-type="event" title="Event">○</button>
          <button type="button" data-type="note" title="Note">–</button>
        </div>
        <input type="text" id="entry-input" placeholder="Add a task, event, or note for today..." autocomplete="off">
        <button type="submit" id="add-btn" title="Add entry">↑</button>
      </form>
      <div class="legend">
        <span>• task</span>
        <span>○ event</span>
        <span>– note</span>
        <span>☆ important</span>
        <span>⊘ cancel</span>
        <span>Double-click text to edit</span>
      </div>
    </div>
  </main>
</div>

<script>
  const STORAGE_KEY = 'bulletJournalEntries';
  const THEME_KEY = 'bulletJournalTheme';
  const BULLET_SYMBOLS = { event: '○', note: '–' };
  const STATUS_ORDER = ['incomplete', 'completed', 'migrated', 'scheduled'];
  const STATUS_SYMBOLS = { incomplete: '•', completed: '✔', migrated: '>', scheduled: '<' };

  function genId() {
    return Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatDateLabel(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function formatDateShort(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function normalizeEntry(e) {
    return {
      id: e.id || genId(),
      text: e.text || '',
      type: (e.type === 'task' || e.type === 'event' || e.type === 'note') ? e.type : 'note',
      date: e.date || todayKey(),
      status: STATUS_ORDER.includes(e.status) ? e.status : (e.completed ? 'completed' : 'incomplete'),
      cancelled: !!e.cancelled,
      important: !!e.important,
      parentId: e.parentId || null
    };
  }

  function loadEntries() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      return raw.map(normalizeEntry);
    } catch (e) {
      return [];
    }
  }

  function saveEntries(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  let entries = loadEntries();
  let selectedType = 'task';
  let addingSubnoteFor = null;
  let searchQuery = '';
  let filterType = 'all';
  const TODAY = todayKey();

  const form = document.getElementById('entry-form');
  const input = document.getElementById('entry-input');
  const typeSelect = document.getElementById('type-select');
  const todayList = document.getElementById('today-list');
  const incompleteList = document.getElementById('incomplete-list');
  const migratedList = document.getElementById('migrated-list');
  const historyContainer = document.getElementById('history-container');
  const todayDisplay = document.getElementById('today-display');
  const todayLabel = document.getElementById('today-label');
  const themeToggle = document.getElementById('theme-toggle');
  const exportBtn = document.getElementById('export-btn');
  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');
  const searchInput = document.getElementById('search-input');
  const filterSelect = document.getElementById('filter-select');
  const focusInputBtn = document.getElementById('focus-input-btn');
  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const sidebarClose = document.getElementById('sidebar-close');
  const sidebarOverlay = document.getElementById('sidebar-overlay');

  todayDisplay.textContent = formatDateLabel(TODAY);
  todayLabel.textContent = formatDateShort(TODAY);

  // --- Mobile sidebar toggle ---
  function openSidebar() { document.body.classList.add('sidebar-open'); }
  function closeSidebar() { document.body.classList.remove('sidebar-open'); }
  sidebarToggle.addEventListener('click', openSidebar);
  sidebarClose.addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  focusInputBtn.addEventListener('click', () => { input.focus(); closeSidebar(); });

  // --- Theme ---
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
  }
  let currentTheme = localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light';
  applyTheme(currentTheme);
  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, currentTheme);
    applyTheme(currentTheme);
  });

  // --- Export / Import ---
  exportBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bullet-journal-export-' + TODAY + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error('not an array');
        if (!confirm('Importing will replace all current entries. Continue?')) return;
        entries = parsed.map(normalizeEntry);
        saveEntries(entries);
        addingSubnoteFor = null;
        render();
      } catch (err) {
        alert('Import failed: the selected file is not a valid Bullet Journal export.');
      } finally {
        importFile.value = '';
      }
    };
    reader.readAsText(file);
  });

  // --- Search / Filter (sidebar history only) ---
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    render();
  });
  filterSelect.addEventListener('change', () => {
    filterType = filterSelect.value;
    render();
  });

  function matchesFilter(entry) {
    if (filterType === 'important' && !entry.important) return false;
    if (filterType !== 'all' && filterType !== 'important' && entry.type !== filterType) return false;
    if (searchQuery && !entry.text.toLowerCase().includes(searchQuery)) return false;
    return true;
  }

  // --- Type selector ---
  typeSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    selectedType = btn.dataset.type;
    typeSelect.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
  });

  // --- Add entry ---
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    entries.push({
      id: genId(),
      text,
      type: selectedType,
      date: TODAY,
      status: 'incomplete',
      cancelled: false,
      important: false,
      parentId: null
    });
    saveEntries(entries);
    input.value = '';
    render();
    input.focus();
  });

  // --- Mutations ---
  function cycleStatus(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry || entry.type !== 'task') return;
    const idx = STATUS_ORDER.indexOf(entry.status);
    entry.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
    saveEntries(entries);
    render();
  }

  function toggleImportant(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    entry.important = !entry.important;
    saveEntries(entries);
    render();
  }

  function toggleCancelled(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    entry.cancelled = !entry.cancelled;
    saveEntries(entries);
    render();
  }

  function deleteEntry(id) {
    const entry = entries.find(en => en.id === id);
    if (!entry) return;
    const hasChildren = entries.some(en => en.parentId === id);
    const msg = hasChildren
      ? 'Delete this entry and its sub-notes? This cannot be undone.'
      : 'Delete this entry? This cannot be undone.';
    if (!confirm(msg)) return;
    entries = entries.filter(en => en.id !== id && en.parentId !== id);
    saveEntries(entries);
    render();
  }

  function commitEdit(entry, newText) {
    const val = newText.trim();
    if (val) entry.text = val;
    saveEntries(entries);
    render();
  }

  function startEdit(li, entry) {
    const textSpan = li.querySelector('.entry-text');
    if (!textSpan) return;
    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'edit-input';
    inputEl.value = entry.text;
    textSpan.replaceWith(inputEl);
    inputEl.focus();
    inputEl.select();

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      commitEdit(entry, inputEl.value);
    };
    const cancelEdit = () => {
      if (settled) return;
      settled = true;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    });
  }

  function createSubnoteInputRow(parentEntry) {
    const li = document.createElement('li');
    li.className = 'entry-item subnote-input-row';
    const inputEl = document.createElement('input');
    inputEl.type = 'text';
    inputEl.className = 'edit-input';
    inputEl.placeholder = 'Sub-note...';
    li.appendChild(inputEl);

    let settled = false;
    const commit = () => {
      if (settled) return;
      settled = true;
      const val = inputEl.value.trim();
      if (val) {
        entries.push({
          id: genId(),
          text: val,
          type: 'note',
          date: parentEntry.date,
          status: 'incomplete',
          cancelled: false,
          important: false,
          parentId: parentEntry.id
        });
        saveEntries(entries);
      }
      addingSubnoteFor = null;
      render();
    };
    const cancelAdd = () => {
      if (settled) return;
      settled = true;
      addingSubnoteFor = null;
      render();
    };

    inputEl.addEventListener('blur', commit);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inputEl.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); cancelAdd(); }
    });

    requestAnimationFrame(() => inputEl.focus());
    return li;
  }

  function createEntryItem(entry, opts) {
    opts = opts || {};
    const li = document.createElement('li');
    li.className = 'entry-item';
    if (entry.status === 'completed') li.classList.add('completed');
    if (entry.cancelled) li.classList.add('cancelled');
    if (entry.important) li.classList.add('important');
    if (entry.parentId) li.classList.add('sub-entry');
    li.dataset.status = entry.status;

    const bullet = document.createElement('span');
    bullet.className = 'bullet-mark ' + entry.type;
    if (entry.type === 'task') {
      bullet.textContent = STATUS_SYMBOLS[entry.status];
      bullet.classList.add('clickable');
      bullet.title = 'Click to cycle status: incomplete → completed → migrated → scheduled';
      bullet.addEventListener('click', () => cycleStatus(entry.id));
    } else {
      bullet.textContent = BULLET_SYMBOLS[entry.type];
      bullet.title = entry.type === 'event' ? 'Event' : 'Note';
    }

    const text = document.createElement('span');
    text.className = 'entry-text';
    text.textContent = entry.text;
    text.title = 'Double-click to edit';
    text.addEventListener('dblclick', () => startEdit(li, entry));

    const starBtn = document.createElement('button');
    starBtn.type = 'button';
    starBtn.className = 'star-btn' + (entry.important ? ' active' : '');
    starBtn.textContent = entry.important ? '★' : '☆';
    starBtn.title = entry.important ? 'Unmark important' : 'Mark important';
    starBtn.addEventListener('click', () => toggleImportant(entry.id));

    li.appendChild(bullet);
    li.appendChild(text);

    if (opts.showDateChip) {
      const chip = document.createElement('span');
      chip.className = 'date-chip';
      chip.textContent = formatDateShort(entry.date);
      li.appendChild(chip);
    }

    li.appendChild(starBtn);

    const actions = document.createElement('span');
    actions.className = 'actions';

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'icon-btn cancel-btn' + (entry.cancelled ? ' active' : '');
    cancelBtn.textContent = '⊘';
    cancelBtn.title = entry.cancelled ? 'Uncancel entry' : 'Cancel entry';
    cancelBtn.addEventListener('click', () => toggleCancelled(entry.id));
    actions.appendChild(cancelBtn);

    if (!entry.parentId) {
      const subBtn = document.createElement('button');
      subBtn.type = 'button';
      subBtn.className = 'icon-btn sub-btn';
      subBtn.textContent = '+';
      subBtn.title = 'Add sub-note';
      subBtn.addEventListener('click', () => {
        addingSubnoteFor = addingSubnoteFor === entry.id ? null : entry.id;
        render();
      });
      actions.appendChild(subBtn);
    }

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'icon-btn delete-btn';
    del.textContent = '✕';
    del.title = 'Delete';
    del.addEventListener('click', () => deleteEntry(entry.id));
    actions.appendChild(del);

    li.appendChild(actions);
    return li;
  }

  // Renders a flat board section: top-level entries matching filterTopFn, plus their sub-notes.
  function buildFlatSection(filterTopFn, opts) {
    const top = entries.filter(en => !en.parentId && filterTopFn(en));
    const elements = [];
    top.forEach(t => {
      elements.push(createEntryItem(t, opts));
      entries.filter(en => en.parentId === t.id).forEach(k => elements.push(createEntryItem(k, opts)));
      if (addingSubnoteFor === t.id) elements.push(createSubnoteInputRow(t));
    });
    return elements;
  }

  // Renders a day's entries for the sidebar history, honoring the active search/filter.
  function buildDayEntryElements(dayEntries, applyFilter) {
    const topEntries = dayEntries.filter(en => !en.parentId);
    const childEntries = dayEntries.filter(en => en.parentId);
    const activeFilter = applyFilter && (searchQuery !== '' || filterType !== 'all');

    let topToShow = topEntries;
    if (activeFilter) {
      topToShow = topEntries.filter(top =>
        matchesFilter(top) || childEntries.some(c => c.parentId === top.id && matchesFilter(c))
      );
    }

    const elements = [];
    topToShow.forEach(top => {
      elements.push(createEntryItem(top));
      let kids = childEntries.filter(c => c.parentId === top.id);
      if (activeFilter) kids = kids.filter(matchesFilter);
      kids.forEach(k => elements.push(createEntryItem(k)));
      if (addingSubnoteFor === top.id) elements.push(createSubnoteInputRow(top));
    });
    return elements;
  }

  function renderEmpty(container, message) {
    const empty = document.createElement('li');
    empty.className = 'empty-state';
    empty.textContent = message;
    container.appendChild(empty);
  }

  function render() {
    // ----- Today's Entries -----
    todayList.innerHTML = '';
    const todayTopCount = entries.filter(en => en.date === TODAY && !en.parentId).length;
    if (todayTopCount === 0) {
      renderEmpty(todayList, 'No entries yet today. Add one below.');
    } else {
      buildFlatSection(en => en.date === TODAY).forEach(li => todayList.appendChild(li));
    }

    // ----- Incomplete Tasks (previous days, still open) -----
    incompleteList.innerHTML = '';
    const incompleteEls = buildFlatSection(
      en => en.type === 'task' && en.date !== TODAY && en.status === 'incomplete' && !en.cancelled,
      { showDateChip: true }
    );
    if (incompleteEls.length === 0) {
      renderEmpty(incompleteList, "You're all caught up — no incomplete tasks from previous days.");
    } else {
      incompleteEls.forEach(li => incompleteList.appendChild(li));
    }

    // ----- Upcoming / Migrated Tasks -----
    migratedList.innerHTML = '';
    const migratedEls = buildFlatSection(
      en => en.type === 'task' && en.date !== TODAY && (en.status === 'migrated' || en.status === 'scheduled') && !en.cancelled,
      { showDateChip: true }
    );
    if (migratedEls.length === 0) {
      renderEmpty(migratedList, 'No migrated or scheduled tasks.');
    } else {
      migratedEls.forEach(li => migratedList.appendChild(li));
    }

    // ----- Sidebar History (grouped by past date) -----
    historyContainer.innerHTML = '';
    const pastDates = [...new Set(entries.filter(en => en.date !== TODAY).map(en => en.date))]
      .sort((a, b) => b.localeCompare(a));

    const activeFilter = searchQuery !== '' || filterType !== 'all';

    if (pastDates.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = 'No past entries yet.';
      historyContainer.appendChild(empty);
      return;
    }

    let anyDayRendered = false;
    pastDates.forEach(dateKey => {
      const dayEntries = entries.filter(en => en.date === dateKey);
      const elements = buildDayEntryElements(dayEntries, true);
      if (activeFilter && elements.length === 0) return;

      anyDayRendered = true;
      const details = document.createElement('details');
      details.className = 'history-day';
      details.open = activeFilter;

      const summary = document.createElement('summary');

      const row = document.createElement('div');
      row.className = 'day-row';
      const labelSpan = document.createElement('span');
      labelSpan.innerHTML = '<span class="arrow">›</span>' + formatDateShort(dateKey);
      labelSpan.title = formatDateLabel(dateKey);
      const countSpan = document.createElement('span');
      countSpan.className = 'count';
      countSpan.textContent = activeFilter
        ? elements.length + ' match' + (elements.length === 1 ? '' : 'es')
        : dayEntries.length + (dayEntries.length === 1 ? ' entry' : ' entries');
      row.appendChild(labelSpan);
      row.appendChild(countSpan);
      summary.appendChild(row);

      const preview = document.createElement('div');
      preview.className = 'day-important-preview';
      const importantOnes = dayEntries.filter(en => en.important);
      if (importantOnes.length === 0) {
        const none = document.createElement('div');
        none.className = 'imp-chip none';
        none.textContent = 'No important entries';
        preview.appendChild(none);
      } else {
        importantOnes.slice(0, 4).forEach(en => {
          const chip = document.createElement('div');
          chip.className = 'imp-chip';
          chip.textContent = '★ ' + en.text;
          preview.appendChild(chip);
        });
        if (importantOnes.length > 4) {
          const more = document.createElement('div');
          more.className = 'imp-chip none';
          more.textContent = '+' + (importantOnes.length - 4) + ' more';
          preview.appendChild(more);
        }
      }
      summary.appendChild(preview);

      const list = document.createElement('ul');
      list.className = 'entry-list';
      elements.forEach(li => list.appendChild(li));

      details.appendChild(summary);
      details.appendChild(list);
      historyContainer.appendChild(details);
    });

    if (!anyDayRendered) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = 'No past entries match your search.';
      historyContainer.appendChild(empty);
    }
  }

  render();
</script>
</body>
</html>
